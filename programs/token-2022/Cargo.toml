[package]
name = "pwrc_token"
version = "1.0.0"
description = "PowerChain PWRC Token-2022 Protocol™ - Renewable Infrastructure Digital Asset Layer"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "pwrc_token"
crate-type = [
    "cdylib",
    "lib"
]


# -----------------------------------------------------
# Dependencies
# -----------------------------------------------------

[dependencies]

anchor-lang = {
    version = "0.31.1",
    features = [
        "init-if-needed"
    ]
}


anchor-spl = {
    version = "0.31.1",
    features = [
        "token_2022",
        "metadata"
    ]
}


# Solana program interfaces

solana-program = "2.1.0"


# SPL Token-2022 extensions

spl-token-2022 = {
    version = "6.0.0",
    features = [
        "no-entrypoint"
    ]
}


spl-token-metadata-interface = "0.6.0"


spl-transfer-hook-interface = "0.6.0"


spl-type-length-value = "0.6.0"


# Serialization

borsh = "1.5.7"

serde = {
    version = "1.0",
    features = [
        "derive"
    ]
}


serde_json = "1.0"




# -----------------------------------------------------
# Development Dependencies
# -----------------------------------------------------

[dev-dependencies]

anchor-client = "0.31.1"

solana-sdk = "2.1.0"

tokio = {
    version = "1",
    features = [
        "macros",
        "rt-multi-thread"
    ]
}



# -----------------------------------------------------
# Release Profile
# -----------------------------------------------------

[profile.release]

overflow-checks = true

lto = "fat"

codegen-units = 1

opt-level = "z"

strip = "symbols"

panic = "abort"



# -----------------------------------------------------
# Anchor Configuration
# -----------------------------------------------------

[features]

default = []

cpi = [
    "no-entrypoint"
]


no-entrypoint = []

no-idl = []

no-log-ix-name = []

idl-build = [
    "anchor-lang/idl-build",
    "anchor-spl/idl-build"
]
