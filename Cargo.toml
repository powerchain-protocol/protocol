[workspace]
members = [
  "programs/powerchain",
  "programs/svm/pinocchio-powerchain",
]
resolver = "2"

[workspace.package]
version = "1.0.0-beta.1"
edition = "2021"
license = "Apache-2.0"
authors = ["PowerChain Engineering"]
repository = "https://github.com/powerchain-protocol/powerchain"
rust-version = "1.84"

[workspace.dependencies]
anchor-lang = "1.0.2"
anchor-spl = "1.0.2"
pinocchio = "0.11.1"
pinocchio-log = "0.5.1"
pinocchio-pubkey = "0.3.0"
pinocchio-system = "0.6.1"
pinocchio-token = "0.5.0"
pinocchio-token-2022 = "0.3.1"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
