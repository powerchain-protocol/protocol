
name = "powerchain-edge"
main = "src/worker.ts"
compatibility_date = "2026-07-30"
workers_dev = false

[vars]
ORIGIN_API = "https://api.powerchain.energy"
ORIGIN_WEB = "https://powerchain.energy"

[[routes]]
pattern = "api.powerchain.energy/*"
zone_name = "powerchain.energy"

[[ratelimits]]
name = "AUTH_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "API_RATE_LIMITER"
namespace_id = "1002"
simple = { limit = 300, period = 60 }
